name: IJsmetingen testen (alleen op claude-branches)

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python3 tools/probe.py 2>&1 | cut -c1-6000
