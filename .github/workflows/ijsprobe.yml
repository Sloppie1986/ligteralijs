name: IJsmetingen testen (alleen op claude-branches)

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test
        run: |
          true
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/data.json -o prev.json || echo {} > prev.json
          python3 ijsmetingen.py prev.json
          python3 monitor.py out.json prev.json | cut -c1-1500
          python3 -c "import json;d=json.load(open('out.json'));k=d['ijskaart'];print(len(k['points']),'punten',k.get('wow_count'),'wow',len(k.get('ground',[])),'grond',d['alerts'][:5]);[print(p['place'],p.get('morning_cm'),p.get('station')) for p in k['points']]"
