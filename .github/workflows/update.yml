name: IJsklok bijwerken

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # elk kwartier, net naast de drukke hele en halve uren
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # nodig om de site naar de gh-pages branch te pushen
  issues: write     # Instagram-voorstellen als issue

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      ONESIGNAL_KEY: ${{ secrets.ONESIGNAL_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pillow installeren (voor plaatjes)
        run: pip install --quiet pillow==11.0.0 anthropic

      - name: Vorige data ophalen
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/data.json" -o prev.json \
            || curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json" -o prev.json \
            || echo '{}' > prev.json

      - name: Alle bronnen ophalen
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python3 monitor.py site/data.json prev.json | tee result.json

      - name: Vertalen en kaarten uitleggen (Claude Haiku, alleen nieuwe items)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 enrich.py site/data.json prev.json || echo "verrijken mislukt, site gaat gewoon door"

      - name: Berichten en kaarten laten beoordelen door Claude (1x per dagdeel)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 assess.py site/data.json || echo "beoordeling mislukt, site gaat gewoon door"

      - name: Instagram-voorstel bij belangrijk ijsnieuws (wordt nooit automatisch gepost)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_INSTA_TOPIC: ${{ secrets.NTFY_INSTA_TOPIC }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 insta.py site/data.json prev.json || { echo "voorstel maken mislukt, site gaat gewoon door"; exit 0; }
          [ -f insta_out/caption.txt ] || exit 0
          name="$(date -u +%Y%m%d-%H%M).png"
          # plaatje bewaren op de branch 'instagram', zodat het issue het kan tonen
          ( mkdir ib && cd ib && git init -q && git checkout -q -b instagram
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
            git fetch -q --depth 1 origin instagram && git checkout -q -B instagram FETCH_HEAD || true
            mkdir -p voorstellen && cp ../insta_out/voorstel.png "voorstellen/$name"
            git add -A && git commit -qm "Instagram-voorstel $name" && git push -q origin instagram ) || echo "plaatje opslaan mislukt"
          { cat insta_out/issue.md; echo; echo "![voorstel](https://raw.githubusercontent.com/${GH_REPO}/instagram/voorstellen/${name})"; } > insta_out/body.md
          gh issue create --title "$(cat insta_out/title.txt)" --body-file insta_out/body.md || echo "issue maken mislukt"

      - name: Pushmelding naar alle abonnees (OneSignal)
        if: ${{ env.ONESIGNAL_KEY != '' }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          alerts = json.load(open("site/data.json")).get("alerts") or []
          app_id = json.load(open("site/config.json")).get("onesignal_app_id")
          if alerts and app_id:
              url = f"https://{os.environ['GITHUB_REPOSITORY_OWNER'].lower()}.github.io/{os.environ['GITHUB_REPOSITORY'].split('/')[1]}/"
              body = {"app_id": app_id, "target_channel": "push", "included_segments": ["Total Subscriptions"],
                      "headings": {"en": "Ligt er al ijs?", "nl": "Ligt er al ijs?"},
                      "contents": {"en": "\n".join(alerts)[:900], "nl": "\n".join(alerts)[:900]},
                      "url": url, "ttl": 10800}
              req = urllib.request.Request("https://api.onesignal.com/notifications?c=push", data=json.dumps(body).encode(),
                                           headers={"Content-Type": "application/json", "Authorization": "Key " + os.environ["ONESIGNAL_KEY"]})
              print(urllib.request.urlopen(req, timeout=20).read()[:200])
          PY

      - name: Melding sturen bij relevante verandering
        if: ${{ env.NTFY_TOPIC != '' }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          alerts = json.load(open("site/data.json")).get("alerts") or []
          if alerts:
              url = f"https://{os.environ['GITHUB_REPOSITORY_OWNER'].lower()}.github.io/{os.environ['GITHUB_REPOSITORY'].split('/')[1]}/"
              req = urllib.request.Request("https://ntfy.sh/" + os.environ["NTFY_TOPIC"],
                                           data="\n".join(alerts).encode(),
                                           headers={"Title": "Ligt er al ijs?", "Click": url, "Tags": "ice_skate"})
              urllib.request.urlopen(req, timeout=20)
              print("melding verstuurd:", len(alerts))
          PY

      # Publiceren via de gh-pages branch (Pages-bron: "Deploy from a branch").
      # Steeds één verse commit, zodat de repo niet groeit door alle data-versies.
      - name: Site naar gh-pages branch pushen
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Bijgewerkt $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
